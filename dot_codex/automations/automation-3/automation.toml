prompt = "每天 19:30（Asia/Shanghai）执行产品组下班打卡提醒。提醒对象为：刘庆晨（11723，钉钉 userId 15365380626118202）、雷奇颖（13463，131029396）、蔡宗敏（13554，181819581433504633）、杨茹（14984，151516944）、朱琳（15281，154190878）、文秋红（26695，190910282525976318）。\n\n优先使用本地脚本 /Users/liuqingchen/.codex/automations/automation-3/run_reminder.py，并把执行拆成两个可分别审批的阶段：\n1. 先执行 `python3 /Users/liuqingchen/.codex/automations/automation-3/run_reminder.py query`。该阶段只读取 ~/.config/db-profiles/doris.env 连接 Doris 并查询 hris_ads.attendance_records；只输出 missing_count 和 pending_state，不发送钉钉，不输出或记录凭据、钉钉 userId、人员姓名、具体打卡时间或已完成者。若需要权限审批，只为该查库命令单独申请。\n2. query 成功后，再执行 `python3 /Users/liuqingchen/.codex/automations/automation-3/run_reminder.py send`。该阶段只读取上一步生成的本地待发送状态、读取 ~/.config/dingtalk-bots/product-attendance.env 并通过带加签的钉钉自定义机器人 Webhook 发送；若需要权限审批，只为该发送命令单独申请。发送成功后脚本会清理待发送状态。\n\n查询规则：按当天 dt、上述工号字段 job_number、deleted=0 检查是否存在 attendance_time 在当天 18:30:00（Asia/Shanghai）之后（含 18:30:00）且早于次日 00:00:00 的打卡记录。仅筛选当天没有任何一条 18:30:00 之后打卡记录的人员；当天早些时候即使已有两条或更多记录，也仍视为下班缺卡。\n\n发送规则：\n- 若无人缺卡，发送“【产品组打卡提醒】下班打卡：均已完成。”，不列姓名、不 @。\n- 若有人缺卡，消息只包含对应 @ 和“请及时完成下班打卡。”，不得展示具体打卡时间或已完成者。\n\n签名规则：只从 ~/.config/dingtalk-bots/product-attendance.env 读取 DINGTALK_WEBHOOK_TOKEN 与 DINGTALK_WEBHOOK_SECRET；不得写入文件、提示词输出或日志。使用 Python 标准库，以 timestamp + \"\\n\" + secret 计算 HMAC-SHA256，生成 URL 编码 base64 sign 并附加到 oapi.dingtalk.com/robot/send URL。请求为 text 消息，在 at.atUserIds 中仅传缺卡员工的钉钉 userId。\n\n执行完成后仅汇报缺卡人数和发送是否成功，不泄露凭据、钉钉用户 ID、人员明细或具体打卡时间。若 query 已完成但 send 因权限未批或网络失败未完成，汇报“已完成查询、未发送”，不得重复 query；待获得授权后只执行 send。"
